<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitals</title><link rel="stylesheet" href="/static/style.css"></head><body><nav><b>🩺 HealthAI</b><a href="/dashboard">Dashboard</a></nav><main class="page"><h1>Vitals Timeline</h1><form method="post" class="card gridform"><input name="hr" placeholder="Heart rate"><input name="sys" placeholder="Systolic BP"><input name="dia" placeholder="Diastolic BP"><input name="temp" placeholder="Temperature °C"><input name="spo2" placeholder="SpO₂ %"><button class="btn">Save Vitals</button></form><div class="card"><h2>History</h2><table><tr><th>Time</th><th>HR</th><th>BP</th><th>Temp</th><th>SpO₂</th></tr>{% for x in rows %}<tr><td>{{x.created}}</td><td>{{x.hr}}</td><td>{{x.sys}}/{{x.dia}}</td><td>{{x.temp}}</td><td>{{x.spo2}}</td></tr>{% endfor %}</table></div></main></body></html>
