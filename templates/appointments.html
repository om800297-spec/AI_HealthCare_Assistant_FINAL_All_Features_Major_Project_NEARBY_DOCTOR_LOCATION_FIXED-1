<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointments</title><link rel="stylesheet" href="/static/style.css"></head><body><nav><b>🩺 HealthAI</b><a href="/dashboard">Dashboard</a></nav><main class="page"><h1>Appointment Workflow</h1><form method="post" class="card gridform"><input name="doctor" placeholder="Doctor name" required><select name="department"><option>General Medicine</option><option>Cardiology</option><option>Dermatology</option><option>ENT</option><option>Pediatrics</option><option>Emergency</option></select><input name="date" type="datetime-local" required><textarea name="reason" placeholder="Reason"></textarea><button class="btn">Request Appointment</button></form><div class="card"><h2>Requests</h2>{% for x in rows %}<div class="item"><b>{{x.doctor}}</b><span>{{x.department}} · {{x.date}} · {{x.status}}</span></div>{% else %}<p>No requests.</p>{% endfor %}</div></main></body></html>
